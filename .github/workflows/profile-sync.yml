name: Update GitHub Profile

on:
  schedule:
    # 每天 UTC 00:00 (北京时间 08:00) 统一执行一次
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持手动一键触发
  push:
    branches: ["master", "main"]
    paths:
      - ".github/workflows/profile-sync.yml"
      - ".github/scripts/**"

concurrency:
  group: profile-sync
  cancel-in-progress: true

jobs:
  update-profile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # 获取提交到非自己仓库的最新 2 个 PR 和最新 3 个 Issue 并写入 README
      - name: Update External PRs & Issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/update-activity.js

      # 同步博客文章 (读取 https://lolipopj.github.io/rss.xml，按 pubDate 取前 2 篇，按 atom:updated 取前 3 篇)
      - name: Update Latest & Updated Blog Posts
        run: node .github/scripts/update-blogs.js

      # 生成 Lowlighter Metrics 常用编程语言图
      - name: Generate Most Used Programming Languages Metrics
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.languages.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          base: ""
          config_timezone: Asia/Shanghai
          output_action: none

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_ignored: >-
            html, css

      # 生成 Lowlighter Metrics 全年日历活动图
      - name: Generate Full Year Calendar Metrics
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.isocalendar.fullyear.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          base: ""
          config_timezone: Asia/Shanghai
          output_action: none

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # 从 Docker 挂载的 /metrics_renders 拷贝出所有 SVG，并统一单次提交推送到 GitHub
      - name: Copy Metrics Renders and Commit All Changes (Single Push)
        run: |
          sudo cp -f /metrics_renders/* ./ 2>/dev/null || true
          sudo chown -R $USER:$USER ./
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes detected to commit."
          else
            git commit -m "chore: auto-update profile readme and metrics"
            git push origin HEAD:${{ github.ref }}
          fi
